name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: internal/controlplane/web/package-lock.json
      - name: Test issue triage
        run: node --test .github/scripts/issue-triage.test.cjs
      - name: Confirm toolchain
        run: test "$(go env GOVERSION)" = "go1.27.1"
      - name: Scan source for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.24.2 dir --redact --no-banner .
      - name: Install frontend dependencies
        working-directory: internal/controlplane/web
        run: npm ci
      - name: Check frozen release inventory
        run: python3 scripts/verify-release-inventory.py
      - name: Validate release SBOM
        run: |
          python3 scripts/generate-sbom.py /tmp/esf-ci-sbom.json
          python3 -c 'import json, uuid; b=json.load(open("/tmp/esf-ci-sbom.json")); assert b["bomFormat"] == "CycloneDX" and b["specVersion"] == "1.6" and b["serialNumber"].startswith("urn:uuid:"); uuid.UUID(b["serialNumber"][9:])'
      - name: Audit frontend npm graph
        working-directory: internal/controlplane/web
        run: npm audit --audit-level=high
      - name: Audit OpenCode npm graph
        working-directory: agents/opencode
        run: npm audit --audit-level=high --package-lock-only
      - name: Test frontend
        working-directory: internal/controlplane/web
        run: npm test
      - name: Build frontend
        working-directory: internal/controlplane/web
        run: npm run build
      - name: Check tracked frontend is current
        run: |
          git diff --exit-code -- internal/controlplane/web/dist
          test -z "$(git status --porcelain --untracked-files=all -- internal/controlplane/web/dist)"
      - name: Check Go formatting
        shell: bash
        run: |
          git ls-files -z '*.go' | xargs -0 -r gofmt -l | tee /tmp/unformatted-go-files
          test ! -s /tmp/unformatted-go-files
      - name: Run Go vet
        run: go vet ./...
      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Run Go tests with the race detector
        run: go test -race ./...
      - name: Test DSPy intake without credentials
        run: make test-python
      - name: Build Machinist
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-X main.version=ci" -o bin/machinist ./cmd/machinist
          go build -trimpath -o bin/factory ./cmd/factory
          test -x bin/factory
          test -x bin/machinist
          test "$(bin/machinist version)" = "ci"

  macos:
    name: macOS checks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - name: Confirm toolchain
        run: test "$(go env GOVERSION)" = "go1.27.1"
      - name: Run Go tests with the race detector
        run: go test -race ./...
      - name: Build Machinist
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-X main.version=ci" -o bin/machinist ./cmd/machinist
          go build -trimpath -o bin/factory ./cmd/factory
          test -x bin/factory
          test -x bin/machinist
          test "$(bin/machinist version)" = "ci"

  check:
    name: check
    if: always()
    needs:
      - linux
      - macos
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every platform check
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          test "$LINUX_RESULT" = success
          test "$MACOS_RESULT" = success
