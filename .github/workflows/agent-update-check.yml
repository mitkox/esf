name: Agent update check

on:
  workflow_dispatch:
  schedule:
    - cron: "11 9 * * 1"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare official agent releases with qualified pins
        run: python3 scripts/check-agent-updates.py
