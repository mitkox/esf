{{- if and .Values.factory.enabled (not .Values.factory.storage.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "esf.name" . }}-factory
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.factory.storage.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.factory.storage.size }}
{{- end }}
