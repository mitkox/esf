{{- if not .Values.networkPolicy.enabled }}
{{- fail "networkPolicy.enabled must be true for production deployment" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "esf.name" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "esf.name" . }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- range .Values.networkPolicy.egress }}
    - to:
        - ipBlock:
            cidr: {{ required "networkPolicy.egress[].cidr is required" .cidr | quote }}
      ports:
        {{- range .ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
