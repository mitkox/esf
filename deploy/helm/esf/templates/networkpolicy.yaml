{{- if not .Values.networkPolicy.enabled }}
{{- fail "networkPolicy.enabled must be true for production deployment" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "esf.name" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "esf.name" . }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.api.enabled }}
    # The execution API port is the only admitted ingress path. An ingress rule
    # has no `to` peer: omitting the peer admits the port from any source, and
    # every other port stays denied. Ingress source restriction, when wanted,
    # belongs in `from`.
    - ports:
        - {protocol: TCP, port: {{ .Values.api.port }}}
    {{- else }}
    []
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- range .Values.networkPolicy.egress }}
    - to:
        - ipBlock:
            cidr: {{ required "networkPolicy.egress[].cidr is required" .cidr | quote }}
      ports:
        {{- range .ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
